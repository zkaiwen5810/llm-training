[project]
name = "llm-training"
version = "0.1.0"
description = "Python and CPU PyTorch workspace for learning language-model training"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.9.1+cpu", "numpy>=2.2,<3"]

[dependency-groups]
dev = ["ipykernel==6.30.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
